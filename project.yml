name: NotchShelf
options:
  bundleIdPrefix: dev.conceptfab
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "101"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  NotchShelf:
    type: application
    platform: macOS
    sources:
      - path: NotchShelf
    settings:
      base:
        INFOPLIST_FILE: NotchShelf/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotchShelf/NotchShelf.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: dev.conceptfab.notchshelf
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  NotchShelfTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotchShelfTests
    dependencies:
      - target: NotchShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.conceptfab.notchshelf.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NotchShelf:
    build:
      targets:
        NotchShelf: all
        NotchShelfTests: [test]
    test:
      targets:
        - NotchShelfTests
